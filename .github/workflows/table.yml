name: witness-scratch
on:
  push:
    branches: [main]
permissions:
  contents: write
  id-token: write # keyless cosign: GitHub OIDC token -> Fulcio cert
jobs:
  table:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          if [ "$(git log -1 --format=%an)" = "agent-errata-bot" ]; then exit 0; fi
          date -u +%s > beacon.txt
          git config user.name "agent-errata-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add beacon.txt && git commit -m "scratch beacon" && git push
          echo "WITNESS=1" >> "$GITHUB_ENV"
      - if: env.WITNESS == '1'
        run: |
          curl -sSfLo "$RUNNER_TEMP/cosign" https://github.com/sigstore/cosign/releases/download/v2.6.5/cosign-linux-amd64
          echo "c3b4f5410e608af03a5eb0aaac84a4313d8da131248e08ff1759ac70c79d1644  $RUNNER_TEMP/cosign" | sha256sum -c
          chmod +x "$RUNNER_TEMP/cosign"
          git rev-parse HEAD > "$RUNNER_TEMP/witness.txt"
          for i in 1 2 3; do "$RUNNER_TEMP/cosign" sign-blob --yes --bundle "$RUNNER_TEMP/witness.bundle" "$RUNNER_TEMP/witness.txt" && break; sleep 10; done
          cat "$RUNNER_TEMP/witness.txt"
